<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login · Chatbot Akademik Retro-OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/desktop.css" />
  </head>
  <body>
    <noscript
      ><p style="padding: 20px; font-family: sans-serif">
        Aktifkan JavaScript di browser Anda untuk memakai aplikasi ini.
      </p></noscript
    >
    <div id="desktop" class="center">
      <section class="win st active" style="width: min(400px, 94vw)">
        <header class="tb">
          <span data-i="user"></span><span class="t">LOGIN</span>
        </header>
        <div class="wb">
          <div class="loginbot" data-i="bot" data-s="56"></div>
          <h1 class="logo">SELAMAT DATANG</h1>
          <p class="px sub">CHATBOT LAYANAN AKADEMIK</p>
          <p class="muted" style="text-align: center; margin: 0 0 4px">
            Silakan login untuk melanjutkan
          </p>
          <div class="tabs">
            <button type="button" class="tab on" data-r="student">
              Mahasiswa</button
            ><button type="button" class="tab" data-r="admin">Admin</button>
          </div>
          <form id="form" class="col" autocomplete="off">
            <div>
              <label class="l" id="idl">NIM</label
              ><input class="in" id="id" required />
            </div>
            <div>
              <label class="l">PASSWORD</label
              ><input class="in" id="pw" type="password" required />
            </div>
            <div class="bar" id="pb" hidden><i></i></div>
            <button class="btn" id="go">Login</button>
          </form>
          <div class="card muted" id="hint"></div>
        </div>
      </section>
    </div>
    <div id="taskbar">
      <span style="flex: 1"></span><span class="sunk" id="clock"></span>
    </div>
    <script src="assets/js/errors.js"></script>
    <script src="data/seed.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/icons.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
